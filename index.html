<!doctype html>
<html lang="en-IE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#301947">
<meta name="referrer" content="no-referrer">
<title>Student Support Hub · University of Galway student project</title>
<style>:root {
  color-scheme:light; --ink:#2c1b40; --muted:#665a73; --line:#e4ddee; --wash:#f6f2fc; --purple:#703abb;
  --deep:#31194a; --active:#7940c9; --mint:#e3f6ed; --green:#08775f; --orange:#a7491c; --blue:#335d98;
  font:100%/1.5 "Segoe UI", "Helvetica Neue", Arial, sans-serif;
}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);background:#fcfbfe}
button,input{font:inherit}
button,a,input{-webkit-tap-highlight-color:transparent}
button,a{touch-action:manipulation}
button{color:inherit;cursor:pointer}
a{color:var(--purple)}
button{border:0}
a,button,input{outline-offset:3px}
:focus-visible{outline:3px solid #995a14}
[hidden]{display:none!important}
button:disabled{cursor:default;opacity:.5}
.svg-ico{width:1.28rem;height:1.28rem;flex:none;vertical-align:middle;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.skip{position:fixed;left:1rem;top:-6rem;z-index:100;background:white;border-radius:8px;padding:.65rem 1rem}
.skip:focus{top:.5rem}
.shell{display:grid;grid-template-columns:clamp(195px,17vw,252px) minmax(0,1fr);min-height:100vh}
.sidebar{position:sticky;top:0;height:100vh;height:100dvh;background:var(--deep);color:#fff;display:flex;flex-direction:column;padding:2.35rem 1rem 1.4rem;isolation:isolate;overflow:hidden}
.sidebar::after,.sidebar::before{content:"";position:absolute;z-index:-1;pointer-events:none;border-radius:50%}
.sidebar::after{width:260px;height:260px;left:-147px;bottom:-153px;background:#4b2967}
.sidebar::before{width:278px;height:278px;left:-123px;bottom:-224px;border:1px solid #a87fc361}
.brand{display:flex;align-items:center;gap:.77rem;padding:0 .6rem;color:#fff;text-decoration:none;width:fit-content}
.brand-mark{height:3.05rem;width:3.05rem;display:grid;place-items:center;align-self:flex-start;border-radius:.77rem;background:#dfcafa;color:#462562;font:bold 2.2rem/1 Georgia,serif;box-shadow:inset 0 0 0 1px #fff3}
.brand-copy b{font-size:1.22rem;line-height:1.01;display:block;letter-spacing:-.04em}
.brand-copy small{display:block;color:#e0cce9;font-size:.75rem;margin-top:.53rem}
#sideNav{display:grid;gap:.42rem;margin-top:3rem}
.navlink{display:flex;align-items:center;gap:.84rem;min-height:46px;color:#eddfef;font-size:.95rem;font-weight:550;line-height:1.2;padding:.86rem .92rem;border-radius:.68rem;text-decoration:none}
.navlink:hover{background:#ffffff14}
.navlink[aria-current=page]{background:#7941c5;color:white;box-shadow:inset 0 0 0 1px #ffffff18}
.navlink .svg-ico{width:1.14rem;height:1.14rem}
.side-foot{display:flex;align-items:center;gap:.62rem;font-weight:640;font-size:.82rem;margin-top:auto;padding:1.2rem .6rem 0;color:#f1e7f7}
.side-foot small{display:block;font-size:.75rem;color:#d4c0df;font-weight:400;margin-top:.12rem}
.side-seal{border:1px solid #ffffff50;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:700 1rem Georgia,serif}
.workspace{min-width:0}
.topbar{min-height:4.1rem;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:14px;padding:.65rem clamp(1.05rem,3.8vw,4.7rem)}
#crumbs{font-size:.875rem;display:flex;flex-wrap:wrap;align-items:center;gap:.44rem;color:var(--muted);min-width:0}
#crumbs a{color:var(--muted);text-decoration:none}#crumbs a:hover{text-decoration:underline}
#crumbs .crumb-current{font-weight:650;color:var(--ink)}
#crumbs .svg-ico{width:.9rem;height:.9rem}#crumbs .sep{width:.7rem;height:.7rem;color:#9e90ab}
.tools{display:flex;align-items:center;gap:.68rem;flex-shrink:0}
.activity-btn,.profile-btn{display:inline-flex;align-items:center;justify-content:center;gap:.38rem;background:transparent;min-height:40px;min-width:40px}
.activity-btn{border-radius:8px;color:#614f73;font-size:.86rem;font-weight:600;padding:0 .4rem}
.activity-btn:hover,.profile-btn:hover{background:var(--wash)}
.activity-btn .svg-ico{width:1.1rem;height:1.1rem}
.divider{width:1px;height:19px;background:var(--line)}
.profile-btn{border-radius:50%;padding:0}
.profile-btn span{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:#7240bb;color:white;font-size:.87rem;font-weight:720}
main{width:100%;max-width:1220px;margin:0 auto;padding:clamp(1.4rem,3vw,2.7rem) clamp(1.05rem,3.8vw,4.7rem) 2.4rem;outline:0}
main:focus-visible{outline:0}
h1,h2,h3,p{margin:0}
h1,h2,h3{letter-spacing:-.033em;font-weight:720}
h1{font-size:clamp(2rem,3.3vw,3rem);line-height:1.09}
h2{font-size:clamp(1.4rem,2.25vw,1.9rem);line-height:1.18}
h3{font-size:1.05rem;line-height:1.29}
.hero{background:#f2edfc;border:1px solid #e8def6;border-radius:21px;position:relative;overflow:hidden;padding:clamp(1.35rem,2.6vw,2.3rem);isolation:isolate}
.hero-art{position:absolute;z-index:-1;right:0;bottom:0;width:48%;max-width:560px;height:100%;display:flex;align-items:flex-end;justify-content:flex-end;pointer-events:none}
.hero-art svg{width:100%;height:auto;max-height:100%;display:block}
.hero-label{color:#60358b;background:#fffcff;border:1px solid #e4d8ee;display:inline-flex;align-items:center;gap:.38rem;padding:.27rem .66rem;border-radius:30px;font-size:.77rem;font-weight:700}
.hero-label .svg-ico{width:.91rem;height:.91rem}
.hero h1{max-width:70%;margin:.85rem 0 .58rem;font-size:clamp(2.15rem,3.6vw,3.35rem);line-height:1.04;letter-spacing:-.047em}
.hero-text{max-width:54%;font-size:1rem;color:#51405f;line-height:1.48}
.searchbar{position:relative;width:min(100%,36rem);height:3.15rem;display:flex;align-items:center;gap:.65rem;padding:0 .95rem;background:white;border:1px solid #cfc0e2;border-radius:10px;box-shadow:0 2px 6px #30204308}
.hero .searchbar{margin-top:1.25rem;width:min(56%,36rem)}
.searchbar:focus-within{outline:2px solid #7541bb;outline-offset:1px}
.searchbar>.svg-ico{color:#735c89;width:1.15rem;height:1.15rem}
.searchbar input{border:0;min-width:0;width:100%;height:100%;color:var(--ink);font:inherit;font-size:.95rem;outline:0;background:transparent}
.searchbar input::placeholder{color:#72667d;opacity:1}
.searchbar input::-webkit-search-cancel-button{display:none}
.searchbar kbd{font-family:inherit;border:1px solid #e0d9e8;border-radius:4px;padding:.02rem .33rem;color:#776887;font-size:.78rem}
.clear-search{background:transparent;min-width:32px;min-height:36px;color:#6b5382}
.topics-section{margin-top:1.58rem}
.section-line{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:1rem}
.section-line h2{font-size:clamp(1.45rem,2.15vw,1.85rem)}
.count{font-size:.82rem;color:var(--muted);white-space:nowrap}
.topics-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.83rem}
.lilac{--tile:#f0e9fa;--tile-edge:#dfd1f1;--tone:#7042a4}
.mint{--tile:#e0f3e9;--tile-edge:#c8e8d8;--tone:#16775f}
.peach{--tile:#fceada;--tile-edge:#f3d9c2;--tone:#a74c1d}
.blue{--tile:#e4ecfc;--tile-edge:#d0def5;--tone:#345fa7}
.rose{--tile:#fbe5ed;--tile-edge:#efd2df;--tone:#a73b68}
.neutral{--tile:#eeecf3;--tile-edge:#dedbe7;--tone:#625770}
.topic{position:relative;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;gap:1.1rem;padding:1rem 1.1rem 1.05rem;background:var(--tile);border:1px solid var(--tile-edge);color:var(--ink);border-radius:14px;text-decoration:none;min-height:7.8rem;transition:transform .15s,box-shadow .15s}
.topic:hover{transform:translateY(-2px);box-shadow:0 4px 10px #38204d10}
.tile-icon,.heading-icon,.mini-icon,.route-icon{display:inline-grid;place-items:center;flex:none}
.tile-icon{width:2.42rem;height:2.42rem;border-radius:12px;background:#ffffffd9;color:var(--tone)}
.tile-count{position:absolute;top:1.1rem;right:.85rem;color:var(--tone);font-size:.75rem;font-weight:620;line-height:1.2}
.topic strong{font-size:1.04rem;line-height:1.18;letter-spacing:-.02em;max-width:100%}
.home-foot,.sub-footer{display:flex;align-items:center;justify-content:space-between;gap:1rem;border-top:1px solid var(--line);margin-top:1.5rem;padding-top:1rem;color:var(--muted);font-size:.91rem}
.home-foot p{display:flex;align-items:center;gap:.6rem}
.home-foot p .svg-ico{color:#8057a2}
.text-link{font:inherit;font-weight:680;background:transparent;color:var(--purple);text-underline-offset:3px;text-decoration:underline;cursor:pointer;padding:0}
.text-link:hover{color:#4d227c}
.page-heading{display:flex;align-items:flex-start;gap:.95rem;margin-bottom:1.6rem}
.page-heading h1{font-size:clamp(1.85rem,3.15vw,2.65rem);letter-spacing:-.04em}
.page-heading p{margin-top:.45rem;color:var(--muted);font-size:1rem}
.heading-icon{width:3.25rem;height:3.25rem;background:var(--tile,#efe8fa);color:var(--tone,#7543b3);border:1px solid var(--tile-edge,#e7dcf4);border-radius:13px;margin-top:.08rem}
.heading-icon .svg-ico{width:1.55rem;height:1.55rem}
.issue-list,.resource-list,.contact-list,.plan-list{display:grid;gap:.62rem}
.issue-row,.resource-row,.contact-row,.plan-row{display:flex;align-items:center;gap:.95rem;border:1px solid var(--line);border-radius:12px;background:white;padding:.86rem 1.05rem;color:var(--ink)}
.issue-row,.resource-row{text-decoration:none;min-height:66px}
.issue-row:hover,.resource-row:hover{border-color:#b89ada;background:#faf7ff}
.issue-row.chosen{border-color:#9567d6;background:#f6f0ff}
.mini-icon{width:2.46rem;height:2.46rem;border-radius:9px;background:var(--wash);color:var(--purple)}
.mini-icon .svg-ico{width:1.16rem;height:1.16rem}
.row-copy{min-width:0;flex:1}
.row-copy strong,.row-copy h3{display:block;font-size:1rem;font-weight:680;line-height:1.32;letter-spacing:-.012em}
.row-copy small,.row-copy p{display:block;color:var(--muted);font-size:.88rem;margin-top:.18rem;line-height:1.42}
.end-icon{color:#70489b;width:1rem;height:1rem}
.button{display:inline-flex;align-items:center;justify-content:center;gap:.42rem;min-height:42px;padding:.55rem .95rem;border:1px solid #b69bd6;border-radius:9px;background:#fff;color:#6530a0;font-weight:650;font-size:.9rem;line-height:1.3;text-decoration:none;text-align:center;cursor:pointer}
.button:hover{background:#f6f1fd;border-color:#9468bf}
.button.primary{background:#7040b8;border-color:#7040b8;color:white}
.button.primary:hover{background:#5b2e9b}
.button .svg-ico{width:1rem;height:1rem}
.route-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.route-card{display:flex;flex-direction:column;padding:clamp(1.15rem,2.2vw,2rem);border-radius:16px;border:1px solid}
.route-card.online{background:#edfaf4;border-color:#cce9db;--route:#08775f}
.route-card.office{background:#fff5e9;border-color:#f1d9bf;--route:#a75122}
.route-icon{width:2.85rem;height:2.85rem;border-radius:12px;background:#ffffffc9;color:var(--route)}
.route-icon .svg-ico{width:1.52rem;height:1.52rem}
.route-card h2{font-size:clamp(1.3rem,2vw,1.65rem);margin:.95rem 0 .35rem}
.route-card ul,.guide-steps{list-style:none;padding:0;margin:.55rem 0 1.4rem;display:grid;gap:.7rem}
.route-card li,.guide-steps li{display:flex;align-items:baseline;gap:.6rem;font-size:.96rem}
.route-card li .svg-ico{width:1rem;height:1rem;color:var(--route);align-self:flex-start;margin-top:.18rem}
.route-card .button{align-self:flex-start;margin-top:auto}
.support-callout{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:1.07rem 1.25rem;border-radius:13px;background:#eaf1ff;border:1px solid #d5e0f6;margin-top:1rem}
.support-callout h2{font-size:1.13rem}.support-callout p{font-size:.9rem;color:#4b5872;margin-top:.18rem}.support-callout .button{flex:none}
.detail-note{background:#f3eff9;border:1px solid #e5dcf1;border-radius:13px;padding:1rem 1.16rem;line-height:1.55;margin-bottom:1.2rem}
.detail-note.green{background:#eef9f3;border-color:#d0e9db}
.detail-note.apricot{background:#fff5eb;border-color:#f1ddc6}
.detail-note strong,.detail-note h2{display:block;font-size:1.05rem;font-weight:700;letter-spacing:-.015em;margin-bottom:.3rem}
.detail-note p{font-size:.96rem}
.section-title{font-size:1.17rem;margin:1.1rem 0 .62rem}
.sub-footer{justify-content:flex-start;flex-wrap:wrap}.sub-footer .text-link{margin-left:auto}
.smallprint{font-size:.83rem;color:var(--muted);margin-top:.75rem}
.tabbar{display:grid;grid-template-columns:repeat(3,1fr);gap:.3rem;background:#efeaf5;border:1px solid #e7deee;border-radius:12px;padding:.28rem;margin-bottom:1.15rem}
.tabbar a{text-align:center;border-radius:8px;padding:.55rem .35rem;text-decoration:none;color:#654c7f;font-size:.92rem;font-weight:650}
.tabbar a[aria-selected=true]{color:white;background:#7441bd}
.tabbar a:not([aria-selected=true]):hover{background:#ffffffb5}
.contact-row{min-height:4.55rem}
.contact-row .button{flex-shrink:0;font-size:.86rem}
.guide-steps{counter-reset:guide;margin:1rem 0}
.guide-steps li{background:white;border:1px solid var(--line);border-radius:10px;padding:.8rem 1rem;align-items:center}
.guide-steps li::before{counter-increment:guide;content:counter(guide);display:grid;place-items:center;flex:none;width:1.65rem;height:1.65rem;background:var(--wash);color:var(--purple);border-radius:50%;font-weight:700;font-size:.85rem}
.demo-tag{display:inline-block;background:#ffe8ce;color:#87470c;font-size:.75rem;font-weight:680;padding:.2rem .55rem;border-radius:30px;white-space:nowrap}
.chat-head{display:flex;align-items:flex-start;justify-content:space-between;gap:.5rem}.chat-head .page-heading{margin-bottom:1rem}
.chat-panel{border:1px solid var(--line);border-radius:15px;overflow:hidden;background:white}
.chat-local{display:flex;align-items:center;gap:.5rem;padding:.66rem 1rem;font-size:.85rem;color:#59476c;background:#f6f1fb;border-bottom:1px solid var(--line)}
.chat-local .svg-ico{width:1rem;height:1rem}
.chat-log{padding:1.1rem;display:flex;flex-direction:column;gap:.8rem;overflow:auto;min-height:155px;height:clamp(200px,33vh,390px)}
.bubble{max-width:83%;border:1px solid var(--line);padding:.7rem .91rem;border-radius:12px;background:#f7f5fa;align-self:flex-start;overflow-wrap:anywhere;white-space:pre-wrap;font-size:.96rem}
.bubble b{display:block;font-size:.77rem;margin-bottom:.18rem;color:#635374}
.bubble.student{align-self:flex-end;background:#7344b2;color:white;border-color:#7344b2}.bubble.student b{color:#f4e3ff}
.bubble a{display:inline-flex;align-items:center;gap:.25rem;font-size:.88rem;font-weight:650;margin-top:.3rem;text-underline-offset:2px}
.bubble a .svg-ico{width:.85rem;height:.85rem}
.prompt-row{display:flex;flex-wrap:wrap;gap:.4rem;padding:0 1rem .7rem}
.prompt-row button{border:1px solid #ddcfe9;background:#fff;color:#654083;border-radius:20px;padding:.4rem .7rem;font-size:.83rem;font-weight:600;min-height:34px}
.prompt-row button:hover{background:#f5eefb}
.composer{display:flex;gap:.5rem;padding:.7rem .85rem;border-top:1px solid var(--line)}
.composer input{border:1px solid #cfbedc;border-radius:8px;flex:1;min-width:0;font:inherit;padding:.56rem .7rem}
.plan-progress{display:flex;align-items:center;gap:.8rem;margin:0 0 1rem}
.plan-progress progress{width:min(14rem,40%);height:8px;border:0;border-radius:6px;overflow:hidden}
progress::-webkit-progress-bar{background:#e8e2ef}progress::-webkit-progress-value{background:#27856d;border-radius:6px}progress::-moz-progress-bar{background:#27856d}
.plan-progress span{font-size:.88rem;color:var(--muted)}
.plan-row{min-height:4.4rem}
.step-no{width:2.2rem;height:2.2rem;display:grid;place-items:center;border-radius:50%;background:#f0eafa;color:var(--purple);font-weight:700;flex:none}
.plan-row.done .step-no{background:#e3f4ed;color:#18745a}
.plan-row .row-copy a{font-size:.85rem;font-weight:600;text-underline-offset:2px}
.plan-check{display:grid;place-items:center;flex:none;width:44px;height:44px;cursor:pointer}.plan-check input{width:20px;height:20px;accent-color:#18765e;cursor:pointer}
.action-row{display:flex;flex-wrap:wrap;align-items:center;gap:.62rem;margin-top:1.15rem}
.action-row .reset{margin-left:auto}
.empty{border:1px dashed #cbbad9;border-radius:13px;text-align:center;padding:2rem 1rem;color:var(--muted);background:#fbf9fd}
.empty h2{font-size:1.27rem;color:var(--ink);margin-bottom:.4rem}
.empty .button{margin-top:.8rem}
.result-section{margin-top:1.2rem}.result-section .issue-row{min-height:56px;padding:.65rem .85rem}
.result-section .section-title{margin:0 0 .5rem}
.dialog-list{display:grid;gap:.5rem}
dialog{border:1px solid #d9cde3;border-radius:17px;width:min(95vw,34rem);max-height:85dvh;background:white;color:var(--ink);padding:1.3rem;box-shadow:0 24px 80px #29143c30}
dialog::backdrop{background:#21142c66}
.dialog-head{display:flex;align-items:center;justify-content:space-between;gap:.7rem}
.dialog-head h2{font-size:1.45rem}
.dialog-head button{width:38px;height:38px;background:var(--wash);border-radius:50%;display:grid;place-items:center}
dialog p{margin:.65rem 0;color:var(--muted);font-size:.95rem}
.activity-list{list-style:none;margin:.8rem 0;padding:0;max-height:40vh;overflow:auto;border-block:1px solid var(--line)}
.activity-list li{padding:.49rem .1rem;display:grid;grid-template-columns:4.7rem 1fr;gap:.4rem;font-size:.86rem;border-bottom:1px solid #f0ebf4}
.activity-list time{color:var(--muted);font-variant-numeric:tabular-nums}
.toast{position:fixed;z-index:20;bottom:1.25rem;left:50%;transform:translateX(-50%);border-radius:9px;background:#332040;color:#fff;box-shadow:0 5px 22px #32203b25;padding:.65rem 1rem;font-size:.91rem;pointer-events:none;max-width:calc(100% - 2rem);width:max-content}
.toast:empty{display:none}
.sr-only{position:absolute;clip-path:inset(50%);overflow:hidden;width:1px;height:1px;white-space:nowrap}
@media(min-width:1450px){.hero-art{width:50%}.topic{min-height:8.45rem}.topbar{padding-block:.85rem}}
@media(max-width:1020px){.shell{grid-template-columns:186px minmax(0,1fr)}.sidebar{padding-left:.65rem;padding-right:.65rem}.topbar,main{padding-left:1.4rem;padding-right:1.4rem}.topics-grid{gap:.65rem}.topic{padding:.85rem;min-height:7.35rem}.tile-count{font-size:.72rem;right:.55rem;top:.95rem}.topic strong{font-size:.98rem}.brand-copy b{font-size:1.1rem}.hero .searchbar{width:62%}.hero-art{width:45%}}

<script>

  document:'<path d="M5 3h10l4 4v14H5zM15 3v5h4M8 12h8m-8 4h6"/>',

function ic(name, extra='') {
  return `<svg class="svg-ico ${extra}" aria-hidden="true" focusable="false" viewBox="0 0 24 24">${icons[name] || icons.document}</svg>`;
}
function esc(value) {
  return String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}
const routeNames={home:'Home',find:'Find Support',issues:'Choose an issue',options:'Support options',online:'Online support',office:'Office information',help:'Help & Contact',chat:'Live chat demo',plan:'My Plan'};
function url(view,key,tab) {return '#' + [view,key,tab].filter(Boolean).join('/');}
function activeKey(){return active || 'general';}
function subUrl(view){return url(view,activeKey(),view==='help'?'staff':'');}
function jump(hash) {if(location.hash===hash) render();else location.hash=hash;}
function button(href,label,icon='',primary=false){return `<a class="button${primary?' primary':''}" href="${href}">${icon?ic(icon):''}${esc(label)}</a>`;}
function heading(title,desc,icon,tone='lilac'){return `<div class="page-heading"><span class="heading-icon ${tone}">${ic(icon)}</span><div><h1>${esc(title)}</h1>${desc?`<p>${esc(desc)}</p>`:''}</div></div>`;}
function ext(id,label,cls='text-link',suffix=''){const s=sources[id];return `<a class="${cls}" data-res="${id}" href="${esc(s.url)}" target="_blank" rel="noopener noreferrer" aria-label="${esc((label||s.title)+suffix+' (opens in a new tab)')}">${esc(label||s.title)} ${ic('external','end-icon')}</a>`;}
function resourceRow(id){const s=sources[id];return `<a class="resource-row" data-res="${id}" href="${esc(s.url)}" target="_blank" rel="noopener noreferrer"><span class="mini-icon">${ic('document')}</span><span class="row-copy"><strong>${esc(s.title)}</strong><small>${esc(s.detail)}</small></span>${ic('external','end-icon')}<span class="sr-only">Opens in a new tab</span></a>`;}
function resources(ids){return `<div class="resource-list">${[...new Set(ids)].map(resourceRow).join('')}</div>`;}
function note(title,message,cls=''){return `<div class="detail-note ${cls}"><strong>${esc(title)}</strong><p>${esc(message)}</p></div>`;}
function issueRow(href,title,sub,icon,selected=false){return `<a class="issue-row${selected?' chosen':''}" href="${href}"><span class="mini-icon">${ic(selected?'check':icon)}</span><span class="row-copy"><strong>${esc(title)}</strong><small>${esc(sub)}</small></span>${ic('chevron','end-icon')}</a>`;}
function speak(s){const t=document.getElementById('toast');clearTimeout(toastTimer);t.textContent=s;toastTimer=setTimeout(()=>{t.textContent='';},4400);}
const freshChecks=()=>[false,false,false,false];
function readSaved(){
  const blank={last:null,plans:{}};
  try{
    const obj=JSON.parse(localStorage.getItem(storageKey)||'null');
    if(!obj||!obj.plans||typeof obj.plans!=='object')return blank;
    for(const [key,value] of Object.entries(obj.plans)){
      if(cases.has(key)&&Array.isArray(value)&&value.length===4&&value.every(v=>typeof v==='boolean'))blank.plans[key]=value;
    }
    blank.last=Object.hasOwn(blank.plans,obj.last)?obj.last:Object.keys(blank.plans).at(-1)||null;
  }catch{}
  return blank;
}
let saved=readSaved(), active=saved.last, current=null, searchValue='', toastTimer, lastHash='', lastPicked=active;
let drafts=new Map(), conversations=new Map(), events=[], modalType='', dialogOpener=null;
function checks(key){if(!drafts.has(key))drafts.set(key,[...(saved.plans[key]||freshChecks())]);return drafts.get(key);}
function log(action,detail=''){events.push({time:new Date().toISOString(),action,detail});}
function route(){
  const parts=location.hash.slice(1).split('/'), [view='home',cat,id,tail]=parts;
  const name=view||'home';
  if(['home','find'].includes(name)&&parts.length===1)return {v:name};
  if(name==='issues'&&topics.has(cat)&&parts.length===2)return {v:name,c:topics.get(cat)};
  if(['options','online','office','help','chat','plan'].includes(name)){
    const k=cat+'/'+id, entry=cases.get(k);
    if(entry&&(name==='help'?parts.length===3||(parts.length===4&&['staff','chat','escalate'].includes(tail)):parts.length===3))return {v:name,...entry,k,tab:tail||'staff'};
    if(['help','chat','plan'].includes(name)){
      if(!cat&&parts.length===1){const use=active&&cases.get(active);return {v:name,...(use||{}),k:use?active:null,tab:'staff'};}
      if(cat==='general'&&(name==='help'?parts.length===2||(parts.length===3&&['staff','chat','escalate'].includes(id)):parts.length===2))return {v:name,k:null,tab:id||'staff'};
    }
  }
  return {v:'invalid'};
}
function sidebar(st){
  const entries=[['Home','home','#home'],['Find Support','grid','#find'],['My Plan','plan',subUrl('plan')],['Help & Contact','help',subUrl('help')]];
  let section=st.v==='home'?0:st.v==='plan'?2:['chat','help'].includes(st.v)?3:1;
  document.getElementById('sideNav').innerHTML=entries.map(([label,icon,to],n)=>`<a class="navlink" href="${to}" ${n===section?'aria-current="page"':''}>${ic(icon)}<span>${label}</span></a>`).join('');
}
function crumbs(st){
  let items=[];
  if(st.v==='home') items=[['Home',null]];
  else{
    items=[['Home','#home']];
    if(st.c){items.push(['Find Support','#find']);if(st.v!=='issues')items.push([st.c.title,url('issues',st.c.id)]);}
    if(st.v==='issues')items.push([st.c.title,null]);
    else if(st.v==='chat')items.push(['Help & Contact',url('help',st.k||'general','chat')],['Chat demo',null]);
    else items.push([routeNames[st.v]||'Page unavailable',null]);
  }
  document.getElementById('crumbs').innerHTML=items.map(([t,h],n)=>(n?ic('chevron','sep'):'')+(h?`<a href="${h}">${esc(t)}</a>`:`<span class="crumb-current" aria-current="page">${n===0?ic('home')+' ':''}${esc(t)}</span>`)).join('');
}
function searchBox(){return `<form class="searchbar" id="searchForm" role="search">${ic('search')}<label class="sr-only" for="find-input">Search support topics and issues</label><input id="find-input" type="search" autocomplete="off" maxlength="160" placeholder="Search for a problem, e.g. registration or transfer" value="${esc(searchValue)}" aria-controls="matches"><kbd id="slash" aria-hidden="true">/</kbd><button class="clear-search" data-action="clear-search" type="button" aria-label="Clear search" hidden>${ic('close')}</button></form>`;}
function tiles(){return `<section class="topics-section" id="topic-section"><div class="section-line"><h2>How can we help you today?</h2><span class="count">8 topics</span></div><div class="topics-grid">${categories.map(c=>`<a class="topic ${c.tone}" data-category="${c.id}" href="${url('issues',c.id)}"><span class="tile-icon">${ic(c.icon)}</span><span class="tile-count">${c.issues.length} issues</span><strong>${esc(c.title)}</strong></a>`).join('')}</div></section>`;}
function home(find){
  const hero=find?heading('Find Support','Search for an issue or choose a topic below.','grid')+searchBox():`<section class="hero"><div class="hero-art" aria-hidden="true">${document.getElementById('campus-art').innerHTML}</div><span class="hero-label">${ic('campus')} Student Support Hub</span><h1>Welcome to the<br>Student Support Hub</h1><p class="hero-text">Get clear guidance, find the right support and connect with university staff when you need them.</p>${searchBox()}</section>`;
  return hero+`<p id="match-count" class="sr-only" role="status" aria-live="polite"></p><section id="matches" class="result-section" aria-label="Search results" hidden></section>`+tiles()+`<div class="home-foot"><p>${ic('people')} Unsure which office can help?</p><a class="text-link" href="${url('help','general','staff')}">Get human support</a></div>`;
}
function normal(s){return String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/['’]/g,'').replace(/[^a-z0-9]+/g,' ').trim();}
function matchesFor(query){
  const q=normal(query), tokens=q.split(' ').filter(Boolean);
  if(!tokens.length)return [];
  const out=[];
  for(const c of categories){
    const ctext=normal(c.title+' '+c.keywords);
    if(tokens.every(t=>ctext.includes(t)))out.push({score:normal(c.title).includes(q)?100:68,href:url('issues',c.id),title:c.title,sub:'Topic · '+c.issues.length+' issues',icon:c.icon});
    for(const i of c.issues){
      const hi=normal(i.title+' '+i.keywords),lo=normal(i.description+' '+c.title+' '+c.keywords);
      if(tokens.every(t=>hi.includes(t)||lo.includes(t))){
        const rank=(normal(i.title).includes(q)?48:0)+tokens.filter(t=>hi.includes(t)).length*12;
        out.push({score:rank,href:url('options',c.id+'/'+i.id),title:i.title,sub:c.title,icon:c.icon});
      }
    }
  }
  return out.sort((a,b)=>b.score-a.score);
}
function displaySearch(){
  const form=document.getElementById('searchForm');if(!form)return;
  const result=document.getElementById('matches'),has=!!searchValue.trim(),hits=has?matchesFor(searchValue):[];
  result.hidden=!has;document.getElementById('topic-section').hidden=has;
  form.querySelector('kbd').hidden=has;form.querySelector('button').hidden=!has;
  document.getElementById('match-count').textContent=has?`${hits.length} search results`:'';
  result.innerHTML=!has?'':hits.length?`<h2 class="section-title">${hits.length} ${hits.length===1?'result':'results'}</h2><div class="issue-list">${hits.map(h=>issueRow(h.href,h.title,h.sub,h.icon)).join('')}</div>`:`<div class="empty"><h2>No matches found</h2><p>Try a shorter phrase such as “fees”, “Canvas” or “transfer”.</p><button class="button" data-action="clear-search">Browse all topics</button></div>`;
}
function issues(st){return heading(st.c.title,'Choose the issue that best describes your situation.',st.c.icon,st.c.tone)+`<div class="issue-list">${st.c.issues.map(i=>{const key=st.c.id+'/'+i.id;return issueRow(url('options',key),i.title,i.description,'document',lastPicked===key);}).join('')}</div>`;}
function optionCard(cls,icon,title,points,href,label){return `<section class="route-card ${cls}"><div class="route-icon">${ic(icon)}</div><h2>${esc(title)}</h2><ul>${points.map(p=>`<li>${ic('check')}${esc(p)}</li>`).join('')}</ul>${button(href,label)}</section>`;}
function options(st){
  const team=offices[st.i.office];
  return heading(st.i.title,'Choose how you would like to get help.',st.c.icon,st.c.tone)+`<div class="route-grid">`+
    optionCard('online','online','Try an online solution first',['Start with '+sources[st.i.resources[0]].title+'.','Review your notice or the step you are on.','Use the official contact channel if needed.','Keep a record of your enquiry.'],url('online',st.k),'Explore online support')+
    optionCard('office','people','Speak to someone in person',['Check the office location and visiting arrangements.','Bring only the information relevant to your issue.','Explain the step that is unclear.','Ask staff what to do next.'],url('office',st.k),'Find office information')+
    `</div><div class="support-callout"><div><h2>Still not resolved?</h2><p>Find contact details for ${esc(team.title)} and other student services.</p></div>${button(url('help',st.k,'staff'),'Get human support','people')}</div><div class="sub-footer">${button(url('plan',st.k),'View my next-step plan','plan')}<a class="text-link" href="${url('issues',st.c.id)}">Choose a different issue</a></div>`;
}
function detail(st,online){
  const o=offices[st.i.office];
  return heading(online?'Online support':'Office information',st.i.title,online?'online':'pin',online?'mint':'peach')+
    (online?note('Where to start',st.i.guide,'green'):`<div class="detail-note apricot"><strong>${esc(o.title)}</strong><p>${esc(o.visit)}</p></div>`)+
    `<h2 class="section-title">${online?'Official guidance':'Plan your visit'}</h2>`+
    resources(online?st.i.resources:[o.visitSource,...(o.source!==o.visitSource?[o.source]:[]),'map'])+
    `<p class="smallprint">University of Galway links open in a new tab.</p><div class="sub-footer">${button(url('help',st.k,'staff'),'Get human support','people')}${button(url('plan',st.k),'View my plan','plan')}<a class="text-link" href="${url('options',st.k)}">Back to support options</a></div>`;
}
const targetOffice=(st)=>offices[st.i?.office||'enquiry'];
function contactCard(id){
  const o=offices[id];return `<article class="contact-row"><span class="mini-icon">${ic(o.icon)}</span><div class="row-copy"><h3>${esc(o.title)}</h3><p>${esc(o.description)}</p></div>${ext(o.source,'Official contacts','button',' for '+o.title)}</article>`;
}
function help(st){
  const k=st.k||'general',o=targetOffice(st);
  const tabs=[['staff','Contact staff'],['chat','Live chat'],['escalate','Escalate']];
  let body='';
  if(st.tab==='staff'){
    const list=st.i?[st.i.office,...(st.i.office==='registration'?['registry']:[]),'school','programme','support']:['enquiry','registry','school','support'];
    body=`<div class="contact-list">${[...new Set(list)].map(contactCard).join('')}</div><p class="smallprint">Use each office’s official page for its latest contact details.</p>`;
  }else if(st.tab==='chat'){
    body=note('Live chat with a support adviser','Try a sample conversation about your issue. Replies are scripted on this device. To reach university staff, use Contact staff.')+button(url('chat',k),'Open chat demo','chat',true);
  }else{
    body=`<h2 class="section-title">Follow up on an unresolved enquiry</h2><ol class="guide-steps"><li>Find your original enquiry and note the step that is still unclear.</li><li>Follow up with the team that handled it. Include a reference only through its official channel.</li><li>Ask who can review the issue and what to do next. For a formal complaint, check which procedure applies.</li></ol>`+resources([o.source,'enquiry','complaints']);
  }
  return heading('Get Human Support',st.i?'Support for “'+st.i.title+'”.':'Find a university contact, follow up an enquiry or try the chat demo.','people')+
    `<div class="tabbar" role="tablist" aria-label="Human support options">${tabs.map(([id,label])=>`<a id="tab-${id}" role="tab" aria-controls="support-panel" aria-selected="${st.tab===id}" tabindex="${st.tab===id?'0':'-1'}" href="${url('help',k,id)}">${label}</a>`).join('')}</div><section id="support-panel" role="tabpanel" aria-labelledby="tab-${st.tab}">${body}</section><div class="sub-footer">${st.i?button(url('plan',k),'View my next-step plan','plan')+`<a class="text-link" href="${url('options',k)}">Back to support options</a>`:button('#find','Choose a support topic','grid')}</div>`;
}
const prompts=['Where should I start?','Who should I contact?','What should I bring?'];
function chatMessages(st){
  const k=st.k||'general';
  if(!conversations.has(k))conversations.set(k,[{who:'adviser',body:st.i?'Hello! Let’s practise your next step for “'+st.i.title+'”. What would you like to ask?':'Hello! Choose a practice question below, or type a general question about finding student support.'}]);
  return conversations.get(k);
}
function reply(st,message){
  const q=normal(message),o=targetOffice(st),res=st.i?.resources[0]||'enquiry';
  if(/bring|visit|in person|where is|hours|appointment|location|office hours/.test(q))return {body:o.visit+' Bring the wording of your query and check with the office before bringing documents.',link:o.visitSource};
  if(/unresolved|escalat|complaint|no reply|follow up|still waiting/.test(q))return {body:'Follow up on the original enquiry and ask who can review the outstanding step. For a formal complaint, check the University’s published procedure.',link:'complaints'};
  if(/who|contact|staff|email|call|talk/.test(q))return {body:'For this issue, start with '+o.title+'. Its official page lists the ways to get in touch.',link:o.source};
  if(/start|first|guidance|document|registration|register|blocked|step|notice|error|module|transfer|fee|canvas|account/.test(q))return {body:st.i?st.i.guide:'Start with the Student Enquiry Centre, or choose a support topic to get guidance about a specific issue.',link:res};
  return {body:'This demo can show a starting point, a staff contact or how to prepare for a visit. Choose one of the three practice questions below. For an individual reply, use the official contact page.',link:o.source};
}
function bubble(m){return `<div class="bubble ${m.who==='student'?'student':''}"><b>${m.who==='student'?'You':'Example support adviser'}</b>${esc(m.body)}${m.link?'<br>'+ext(m.link,'','') : ''}</div>`;}
function chat(st){
  return `<div class="chat-head">${heading('Live Chat with a Support Adviser',st.i?st.i.title:'General student enquiry','chat')}<span class="demo-tag">Proposed service</span></div><div class="chat-panel"><div class="chat-local">${ic('lock')} Scripted practice on this device. No adviser is connected.</div><div class="chat-log" id="chat-log" role="log" aria-label="Practice conversation" aria-live="polite" aria-relevant="additions">${chatMessages(st).map(bubble).join('')}</div><div class="prompt-row" aria-label="Practice questions">${prompts.map((p,n)=>`<button data-action="prompt" data-n="${n}">${esc(p)}</button>`).join('')}</div><form class="composer" id="chatForm"><label for="message" class="sr-only">Your practice message</label><input id="message" type="text" maxlength="400" autocomplete="off" placeholder="Type a practice message…" aria-describedby="chat-privacy"><button id="send" class="button primary" type="submit" disabled aria-label="Send message">${ic('send')} Send</button></form></div><p class="smallprint" id="chat-privacy">Use sample details. Messages stay in this tab and disappear on reload.</p><div class="sub-footer">${button(url('help',st.k||'general','staff'),'Contact real staff','people')}${st.k?button(url('plan',st.k),'View my plan','plan'):button('#find','Choose a topic','grid')}</div>`;
}
function sendPractice(message){
  const value=message.trim().slice(0,400);if(current.v!=='chat'||!value)return;
  const messages=chatMessages(current),pair=[{who:'student',body:value},{who:'adviser',...reply(current,value)}];messages.push(...pair);
  const el=document.getElementById('chat-log');el.insertAdjacentHTML('beforeend',pair.map(bubble).join(''));el.scrollTop=el.scrollHeight;
  document.getElementById('message').value='';document.getElementById('send').disabled=true;log('Used chat demo','Message text excluded');
}
function steps(st){
  const o=targetOffice(st);
  return [
    {t:'Try the online resources',d:'Start with '+sources[st.i.resources[0]].title+'.',l:'Open online guidance',u:url('online',st.k)},
    {t:'If still unresolved, contact support',d:'Use the published contact route for '+o.title+'.',l:'Find staff contacts',u:url('help',st.k,'staff')},
    {t:'For a complex case, consider an in-person visit',d:'Check the location and arrangements before travelling.',l:'Check office information',u:url('office',st.k)},
    {t:'Practise what to ask in chat',d:'Optional practice with a scripted adviser.',l:'Open the chat demo',u:url('chat',st.k)}
  ];
}
function plan(st){
  if(!st.k)return heading('My Next-Step Plan','Choose an issue to get a checklist for your situation.','plan')+`<div class="empty"><h2>Start with a support topic</h2><p>Your plan will include online guidance, a staff contact and a campus option.</p>${button('#find','Find support','grid',true)}</div>`;
  const values=checks(st.k),n=values.filter(Boolean).length,stored=saved.plans[st.k],isSame=stored&&stored.every((v,i)=>v===values[i]);
  return heading('My Next-Step Plan',st.i.title,'plan')+`<div class="plan-progress"><progress value="${n}" max="4" aria-label="Plan completion"></progress><span id="plan-count" aria-live="polite">${n} of 4 steps complete</span></div><div class="plan-list">${steps(st).map((s,idx)=>`<div class="plan-row${values[idx]?' done':''}"><span class="step-no" aria-hidden="true">${idx+1}</span><div class="row-copy"><h3>${esc(s.t)}</h3><p>${esc(s.d)}</p><a href="${s.u}">${esc(s.l)}</a></div><label class="plan-check"><input type="checkbox" data-step="${idx}" aria-label="${esc(s.t)}" ${values[idx]?'checked':''}></label></div>`).join('')}</div><div class="action-row"><button class="button primary" data-action="save-plan">${ic('save')} Save plan</button><button class="button" data-action="download-plan">${ic('download')} Download plan</button><button class="button reset" data-action="reset">${ic('reset')} Start over</button></div><p class="smallprint" id="save-note">${isSame?'Saved in this browser. You can reopen this plan from Student workspace.':stored?'You have unsaved changes. Save again to keep this version.':'Save to keep this checklist in this browser, or download a text copy with the official links.'}</p>`;
}
function exportText(name,txt){
  const file=URL.createObjectURL(new Blob(['\uFEFF'+txt],{type:'text/plain;charset=utf-8'})),a=document.createElement('a');
  a.href=file;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(file),2000);
}
function planText(st){
  const o=targetOffice(st),ids=[...new Set([...st.i.resources,o.source,o.visitSource,'map'])];
  return ['STUDENT SUPPORT HUB | UNIVERSITY OF GALWAY STUDENT PROJECT','My Next-Step Plan','',st.c.title,st.i.title,'',st.i.guide,'',
    ...steps(st).map((s,n)=>(checks(st.k)[n]?'[x] ':'[ ] ')+s.t+' — '+s.d),
    '',o.title,o.visit,'','Official University of Galway pages',...ids.map(id=>sources[id].title+'\n'+sources[id].url),'',
    'This is a personal checklist. Chat is scripted practice. Office details and appointment arrangements are on the official pages.'].join('\n');
}
function savePlan(){
  const st=current;if(!st.k)return;
  const updated=readSaved();updated.plans[st.k]=[...checks(st.k)];updated.last=st.k;
  try{localStorage.setItem(storageKey,JSON.stringify(updated));saved=updated;document.getElementById('save-note').textContent='Saved in this browser. You can reopen this plan from Student workspace.';log('Saved plan',st.i.title);speak('Plan saved on this device.');}
  catch{document.getElementById('save-note').textContent='This browser could not save the plan. Use Download plan to keep a copy.';speak('Local saving is unavailable. Download your plan to keep it.');}
}
function toggleCheck(input){
  if(current.v!=='plan'||!current.k)return;
  const n=Number(input.dataset.step),values=checks(current.k);values[n]=input.checked;input.closest('.plan-row').classList.toggle('done',input.checked);
  const count=values.filter(Boolean).length;
  main.querySelector('progress').value=count;document.getElementById('plan-count').textContent=count+' of 4 steps complete';
  const stored=saved.plans[current.k];
  document.getElementById('save-note').textContent=stored&&stored.every((v,i)=>v===values[i])?'Saved in this browser. You can reopen this plan from Student workspace.':'Save this version to keep your changes in this browser.';
  log(input.checked?'Checked plan step':'Unchecked plan step',current.i.title+' · '+steps(current)[n].t);
}
function fmt(iso){return new Date(iso).toLocaleTimeString('en-IE',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});}
function modalOpen(type){
  if(!modal.open)dialogOpener=document.activeElement;
  modalType=type;
  let title='',body='';
  if(type==='activity'){
    title='Session activity';
    body=`<p>Actions in this tab, with local times. Search terms and chat text are excluded. Download the record before reloading or starting over.</p><ol class="activity-list">${events.slice().reverse().map(e=>`<li><time datetime="${e.time}">${fmt(e.time)}</time><span><b>${esc(e.action)}</b>${e.detail?' · '+esc(e.detail):''}</span></li>`).join('')}</ol><button class="button" data-action="export-log">${ic('download')} Download activity</button>`;
  }else if(type==='reset'){
    title='Start over?';body='<p>This clears every saved hub plan in this browser, your draft checklists, chat and session activity. Any files you downloaded stay on your device.</p><div class="action-row"><button class="button" data-action="close">Keep my work</button><button class="button primary" data-action="confirm-reset">Clear and start over</button></div>';
  }else{
    title='Student workspace';const list=Object.keys(saved.plans);
    body=`<p>This unofficial University of Galway student project runs in your browser. Open an official contact page to reach university staff.</p><h3 class="section-title">Saved plans on this device</h3>${list.length?`<div class="dialog-list">${list.map(k=>issueRow(url('plan',k),cases.get(k).i.title,cases.get(k).c.title,'plan')).join('')}</div>`:'<p>No saved plans yet. Choose an issue and select Save plan on its checklist.</p>'}<div class="action-row"><button class="button" data-action="activity">${ic('history')} Session activity</button><button class="button" data-action="reset">${ic('reset')} Start over</button></div>`;
  }
  modal.innerHTML=`<div class="dialog-head"><h2 id="modal-heading">${title}</h2><button type="button" data-action="close" aria-label="Close dialog">${ic('close')}</button></div>${body}`;
  if(!modal.open)modal.showModal();modal.querySelector('button').focus();
}
function closeModal(){if(modal.open)modal.close();modalType='';}
function clearAll(){
  let removeFailed=false;
  try{localStorage.removeItem(storageKey);}catch{removeFailed=true;}
  saved={last:null,plans:{}};active=null;lastPicked=null;drafts.clear();conversations.clear();events=[];lastHash='';searchValue='';
  closeModal();jump('#home');speak(removeFailed?'Session cleared. This browser blocked access to saved plans.':'Cleared. You can start a new support journey.');
}
function render(){
  const st=route();current=st;
  if(st.k&&cases.has(st.k)){active=st.k;lastPicked=st.k;}
  if(modal.open)closeModal();
  sidebar(st);crumbs(st);
  switch(st.v){
    case 'home':case 'find': main.innerHTML=home(st.v==='find');displaySearch();break;
    case 'issues':main.innerHTML=issues(st);break;
    case 'options':main.innerHTML=options(st);break;
    case 'online':case 'office':main.innerHTML=detail(st,st.v==='online');break;
    case 'help':main.innerHTML=help(st);break;
    case 'chat':main.innerHTML=chat(st);{const logBox=document.getElementById('chat-log');logBox.scrollTop=logBox.scrollHeight;}break;
    case 'plan':main.innerHTML=plan(st);break;
    default:main.innerHTML=heading('Page unavailable','Use the topic list to find your issue again.','help')+button('#find','Browse support topics','grid',true);break;
  }
  const screen=routeNames[st.v]||'Page unavailable';document.title=screen+' · Student Support Hub';
  if(lastHash!==location.hash||!events.length){log('Opened '+screen,(st.i?.title||st.c?.title||'')+(st.v==='help'?' · '+({staff:'Contact staff',chat:'Live chat',escalate:'Escalate'}[st.tab]):''));}
  lastHash=location.hash;window.scrollTo(0,0);
  if(document.readyState!=='loading')main.focus({preventScroll:true});
  if(restoreTabFocus&&st.v==='help'){document.getElementById('tab-'+st.tab)?.focus();}restoreTabFocus=false;
}
let restoreTabFocus=false;
document.querySelectorAll('[data-icon]').forEach(node=>{node.innerHTML=ic(node.dataset.icon);});
document.addEventListener('click',event=>{
  const target=event.target.closest('button,a');if(!target)return;
  if(target.classList.contains('skip')){event.preventDefault();main.focus();return;}
  if(target.dataset.res){log('Opened official link',sources[target.dataset.res].title);return;}
  if(target.closest('#matches')&&target.matches('a'))log('Selected search result','Search text excluded');
  if(target.matches('[role=tab]'))restoreTabFocus=true;
  if(target.matches('a[href^="#"]')&&modal.open&&!target.dataset.action){closeModal();if(target.hash===location.hash){main.focus({preventScroll:true});}return;}
  const a=target.dataset.action;
  if(a==='clear-search'){searchValue='';document.getElementById('find-input').value='';displaySearch();document.getElementById('find-input').focus();}
  else if(['activity','profile','reset'].includes(a))modalOpen(a);
  else if(a==='close')closeModal();
  else if(a==='confirm-reset')clearAll();
  else if(a==='prompt')sendPractice(prompts[Number(target.dataset.n)]);
  else if(a==='save-plan')savePlan();
  else if(a==='download-plan'&&current.k){exportText('Galway-plan-'+current.k.replace('/','-')+'.txt',planText(current));log('Downloaded plan',current.i.title);speak('Plan download prepared.');}
  else if(a==='export-log'){log('Exported session activity');exportText('Galway-session-activity.txt',['STUDENT SUPPORT HUB | SESSION ACTIVITY','Times are recorded in ISO 8601 (UTC). Search terms and chat text are excluded.','',...events.map(e=>e.time+' | '+e.action+(e.detail?' | '+e.detail:''))].join('\n'));if(modal.open)modalOpen('activity');speak('Activity download prepared.');}
});
document.addEventListener('input',e=>{
  if(e.target.id==='find-input'){searchValue=e.target.value;displaySearch();}
  else if(e.target.id==='message'){document.getElementById('send').disabled=!e.target.value.trim();}
});
document.addEventListener('change',e=>{if(e.target.matches('[data-step]'))toggleCheck(e.target);});
document.addEventListener('submit',e=>{
  if(e.target.id==='chatForm'){e.preventDefault();sendPractice(document.getElementById('message').value);document.getElementById('message').focus();}
  else if(e.target.id==='searchForm'){e.preventDefault();const link=document.querySelector('#matches a');if(link){log('Selected search result','Search text excluded');jump(link.hash);}}
});
document.addEventListener('keydown',e=>{
  if(e.altKey||e.ctrlKey||e.metaKey||modal.open)return;
  if(e.key==='/'&&!e.target.matches('input,textarea')&&document.getElementById('find-input')){e.preventDefault();document.getElementById('find-input').focus();return;}
  if(e.target.id==='find-input'){
    if(e.key==='Escape'){searchValue='';e.target.value='';displaySearch();}
    if(e.key==='ArrowDown'&&document.querySelector('#matches a')){e.preventDefault();document.querySelector('#matches a').focus();}
  }
  if(e.target.matches('#matches a')&&['ArrowDown','ArrowUp'].includes(e.key)){
    e.preventDefault();const links=[...document.querySelectorAll('#matches a')],n=links.indexOf(e.target)+(e.key==='ArrowDown'?1:-1);
    (n<0?document.getElementById('find-input'):links[Math.min(n,links.length-1)]).focus();
  }
  if(e.target.matches('[role=tab]')&&['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){
    e.preventDefault();const tabs=[...document.querySelectorAll('[role=tab]')],idx=tabs.indexOf(e.target);
    const n=e.key==='Home'?0:e.key==='End'?2:(idx+(e.key==='ArrowRight'?1:2))%3;
    restoreTabFocus=true;jump(tabs[n].hash);
  }
});
modal.addEventListener('close',()=>{if(!modal.open&&dialogOpener?.isConnected)dialogOpener.focus({preventScroll:true});modalType='';});
modal.addEventListener('click',e=>{if(e.target!==modal)return;const b=modal.getBoundingClientRect();if(e.clientX<b.left||e.clientX>b.right||e.clientY<b.top||e.clientY>b.bottom)closeModal();});
window.addEventListener('hashchange',render);
window.addEventListener('storage',e=>{if(e.key===storageKey||e.key===null){saved=readSaved();if(modal.open&&modalType==='profile')modalOpen('profile');}});
render();

</script>
</body></html>
